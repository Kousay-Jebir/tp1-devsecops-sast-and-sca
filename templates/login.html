{% extends "base.html" %}
{% block content %}
<h1>Connexion</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login">
    <label>Username <input name="username"></label>
    <label>Password <input name="password" type="password"></label>
    <button type="submit">Login</button>
</form>
{% endblock %}
